name: smoke-test

# End-to-end check that the dependency stack installs and the pipeline runs.
# Catches missing deps (e.g. a script importing a package not in environment.yml)
# before a user hits them. The LLM annotation step is NOT exercised (no API key);
# we run to a non-LLM target that covers the Python and R stacks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conda-smoke:
    name: Conda env + Neutrophil smoke test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}   # login shell so the conda env stays activated
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment from environment.yml
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: caspa

      - name: caspa doctor (must pass)
        run: python caspa/doctor.py

      - name: Scaffold the Neutrophil testset
        run: |
          python caspa/init.py \
            --workdir "$RUNNER_TEMP/nt" \
            --pg-matrix testset/Neutrophil-human/data/pg_matrix.tsv \
            --species human --name CI-smoke

      - name: Run pipeline to a non-LLM target (Python + R stacks)
        run: |
          python caspa/run.py \
            --workdir "$RUNNER_TEMP/nt" --cores 2 \
            --target scp/scplainer/scplainer_variance_explained.tsv

      - name: Assert key outputs exist
        run: |
          test -s "$RUNNER_TEMP/nt/scp/qc/filtered.pg_matrix.tsv"
          test -s "$RUNNER_TEMP/nt/scp/clustering/scp_cluster_assignments.tsv"
          test -s "$RUNNER_TEMP/nt/scp/scplainer/scplainer_variance_explained.tsv"
          echo "Smoke test passed."

  docker:
    name: Build image and publish to GHCR
    needs: conda-smoke          # only build/publish once the smoke test is green
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image (runs caspa doctor during build)
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository_owner }}/caspa" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
      - name: Smoke-run caspa doctor inside the image
        run: docker run --rm --entrypoint python "$IMAGE:latest" caspa/doctor.py
      - name: Publish to GHCR (pushes to main only)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
