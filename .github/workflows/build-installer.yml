name: build-installer

# Compiles the Windows installer (.exe) on a Windows runner and uploads it as an
# artifact. Pushing a version tag (v*) also publishes a GitHub Release with the
# .exe attached. Run manually from the Actions tab for a testable build.

on:
  push:
    branches: [installer]
    tags: ['v*']
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write          # needed to create the Release on a tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "installer\caspa-setup.iss"
          if (-not (Test-Path "installer\Output\caspa-setup.exe")) { throw "installer not produced" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: caspa-setup
          path: installer/Output/caspa-setup.exe
          if-no-files-found: error

      - name: Publish Release (on a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/caspa-setup.exe
          prerelease: true
          generate_release_notes: true
          name: "CASPA ${{ github.ref_name }}"
