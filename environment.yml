# ==============================================================================
# LINUX / macOS install path. bioconda has no win-64 builds for the Bioconductor
# stack below, so this file CANNOT be solved on Windows.
#   Windows users: install Python via miniforge + requirements-windows.txt, and R
#   from CRAN, then run pipeline/scripts/R/install_r_packages.R. See README.
# ==============================================================================
name: caspa
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - snakemake>=7.0
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - umap-learn
  - scanpy            # REQUIRED: imported by scp_joint_embedding_leiden.py & plot_umap_overlays.py
  - harmonypy=0.0.10  # pin: 2.x is a compiled BLAS/Armadillo package; 0.0.x is the tested API
  - leidenalg
  - python-igraph
  - matplotlib
  - seaborn
  - adjusttext        # optional: nicer volcano label placement
  - openai
  - anthropic         # optional: only used when scp.llm.provider = "claude"
  - r-base=4.5          # R 4.5 / Bioconductor 3.21 — the combination CASPA is tested against
  - r-biocmanager
  - bioconductor-scp
  - bioconductor-singlecellexperiment
  - bioconductor-aucell
  - bioconductor-clusterprofiler
  - bioconductor-ihw          # scp Imports this; install it explicitly so scp can load
  - bioconductor-annotationdbi
  - bioconductor-s4vectors
  - bioconductor-org.hs.eg.db
  - bioconductor-org.mm.eg.db
  - bioconductor-gseabase    # GSEABase (AUCell dep); the old 'gsvabase' name does not exist on bioconda
  - r-msigdbr                # msigdbr is a CRAN package, not Bioconductor
  - bioconductor-fgsea       # fgsea is Bioconductor (the old 'r-fgsea' name does not exist)
  - r-data.table
  - r-matrixstats
  - r-optparse
  - r-pheatmap
  - r-uwot
  - r-ggplot2
  - r-igraph
  - pip
  - pip:
      - directlfq     # PyPI-only (not packaged on conda); pulls numba/pyarrow
